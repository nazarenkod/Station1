<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The app icon on the macOS grid: the in-app logo (assets/images/vision-logo.svg)
       on an 824 px tile with Apple's margins and a soft shadow.
       Regenerate every format with: npm run icons -->
  <title>Station#1</title>
  <defs>
    <linearGradient id="vi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="vi-shine" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <svg x="100" y="100" width="824" height="824" viewBox="16 16 480 480">
      <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#vi-bg)"/>
      <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#vi-shine)"/>
      <g transform="translate(256 256) scale(0.9375) translate(-256 -256)" fill="#FFFFFF">
        <rect x="184" y="96" width="46" height="320" rx="23" transform="rotate(12 207 256)"/>
        <rect x="282" y="96" width="46" height="320" rx="23" transform="rotate(12 305 256)"/>
        <rect x="96" y="184" width="320" height="46" rx="23"/>
        <rect x="96" y="282" width="320" height="46" rx="23"/>
        <rect x="237" y="237" width="38" height="38" rx="9" transform="rotate(12 256 256)" fill="#10153A"/>
      </g>
    </svg>
  </g>
</svg>
